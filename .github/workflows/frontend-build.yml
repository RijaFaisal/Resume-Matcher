name: Build & Push Streamlit Frontend
#
on:
  push:
    branches: [ m2_cloud ]
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        run: |
          IMAGE="311785899227.dkr.ecr.eu-north-1.amazonaws.com/streamlit-frontend:${{ github.sha }}"
          docker build -t $IMAGE -f Dockerfile.frontend .
          docker push $IMAGE

      - name: Output URI
        run: echo "IMAGE=311785899227.dkr.ecr.eu-north-1.amazonaws.com/streamlit-frontend:${{ github.sha }}"
