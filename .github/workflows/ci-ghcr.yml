name: CI - Lint, Test, Build & Deploy (GHCR)

on:
  push:
    branches: [ temp ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run Ruff lint
        run: ruff check src tests || true

      - name: Run Black (non-blocking)
        run: black --check src tests || true

      - name: Run tests with coverage
        run: pytest --cov=src --cov-fail-under=70

      # ✅ Debug and disk checks
      - name: Show disk usage before Docker
        run: |
          df -h
          du -sh /* 2>/dev/null

      # ✅ Aggressive cleanup
      - name: Aggressive Docker cleanup
        run: |
          docker system prune -af
          docker builder prune -af
          docker volume prune -f
          rm -rf /tmp/*
          rm -rf /home/runner/.cache/pip/*

      # ✅ Show disk usage after cleanup
      - name: Show disk usage after cleanup
        run: df -h

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & Push Backend
        run: |
          docker build -t ghcr.io/rijafaisal/resume-matcher-backend:${{ github.sha }} -f Dockerfile .
          docker push ghcr.io/rijafaisal/resume-matcher-backend:${{ github.sha }}

      - name: Build & Push Frontend
        run: |
          docker build -t ghcr.io/rijafaisal/resume-matcher-frontend:${{ github.sha }} -f src/ui/Dockerfile src/ui
          docker push ghcr.io/rijafaisal/resume-matcher-frontend:${{ github.sha }}

      - name: Build & Push Evidently
        run: |
          docker build -t ghcr.io/rijafaisal/resume-matcher-evidently:${{ github.sha }} -f monitoring/evidently/Dockerfile monitoring/evidently
          docker push ghcr.io/rijafaisal/resume-matcher-evidently:${{ github.sha }}

      - name: Canary Deploy backend
        run: |
          docker run -d -e CANARY=true -p 8000:8000 ghcr.io/rijafaisal/resume-matcher-backend:${{ github.sha }}
          sleep 10

      - name: Acceptance Tests
        run: |
          urls=("http://localhost:8000/health" "http://localhost:8000/api/v1/ping")
          for url in "${urls[@]}"; do
            echo "Testing $url"
            status=$(curl -o /dev/null -s -w "%{http_code}" $url)
            if [ "$status" -ne 200 ]; then
              echo "❌ $url failed with status $status"
              exit 1
            fi
          done
          echo "✅ All endpoints healthy!"
