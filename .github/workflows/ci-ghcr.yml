name: CI - Lint, Test, Build & Deploy (GHCR)

on:
  push:
    branches: [ temp ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Python (for lint & test only)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3️⃣ Cache Python dependencies (for lint/test)
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4️⃣ Install dependencies (only for lint/test)
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      # 5️⃣ Lint
      - name: Run Ruff lint
        run: ruff check src tests || true

      - name: Run Black (non-blocking)
        run: black --check src tests || true

      # 6️⃣ Run tests with coverage
      - name: Run tests with coverage
        run: pytest --cov=src --cov-fail-under=70

      # 7️⃣ Debug: list directories before Docker build
      - name: List repo files (debug)
        run: |
          echo "PWD: $(pwd)"
          ls -la
          ls -la src || true
          ls -la src/ui || true
          ls -la monitoring/evidently || true

      # 8️⃣ Clean up Docker space
      - name: Docker system prune
        run: docker system prune -af

      # 9️⃣ Log in to GHCR
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 🔟 Build & push backend Docker image
      - name: Build & Push Backend
        run: |
          docker build -t ghcr.io/rijafaisal/resume-matcher-backend:${{ github.sha }} -f Dockerfile .
          docker push ghcr.io/rijafaisal/resume-matcher-backend:${{ github.sha }}

      # 1️⃣1️⃣ Build & push frontend Docker image
      - name: Build & Push Frontend
        run: |
          docker build -t ghcr.io/rijafaisal/resume-matcher-frontend:${{ github.sha }} -f src/ui/Dockerfile src/ui
          docker push ghcr.io/rijafaisal/resume-matcher-frontend:${{ github.sha }}

      # 1️⃣2️⃣ Build & push Evidently Docker image
      - name: Build & Push Evidently
        run: |
          docker build -t ghcr.io/rijafaisal/resume-matcher-evidently:${{ github.sha }} -f monitoring/evidently/Dockerfile monitoring/evidently
          docker push ghcr.io/rijafaisal/resume-matcher-evidently:${{ github.sha }}

      # 1️⃣3️⃣ Canary deploy backend
      - name: Canary Deploy backend
        run: |
          docker run -d -e CANARY=true -p 8000:8000 ghcr.io/rijafaisal/resume-matcher-backend:${{ github.sha }}
          sleep 10

      # 1️⃣4️⃣ Acceptance Tests
      - name: Acceptance Tests
        run: |
          echo "Running acceptance tests..."
          urls=("http://localhost:8000/health" "http://localhost:8000/api/v1/ping")
          for url in "${urls[@]}"; do
            echo "Testing $url"
            status=$(curl -o /dev/null -s -w "%{http_code}" $url)
            if [ "$status" -ne 200 ]; then
              echo "❌ $url failed with status $status"
              exit 1
            fi
          done
          echo "✅ All endpoints healthy!"
