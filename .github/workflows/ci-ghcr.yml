name: CI - Lint, Test, Build & Deploy (GHCR)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true
          docker builder prune -af || true
          docker volume prune -f || true

          echo "After cleanup:"
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run Ruff lint
        run: ruff check src tests || true

      - name: Run Black (non-blocking)
        run: black --check src tests || true

      - name: Run tests with coverage
        run: pytest --cov=src --cov-fail-under=70

      - name: Login to GHCR
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$IMAGE_OWNER" --password-stdin

      - name: Build & Push Backend
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$IMAGE_OWNER/resume-matcher-backend:${{ github.sha }} -f Dockerfile .
          docker push ghcr.io/$IMAGE_OWNER/resume-matcher-backend:${{ github.sha }}

      - name: Build & Push Frontend
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$IMAGE_OWNER/resume-matcher-frontend:${{ github.sha }} -f src/ui/Dockerfile src/ui
          docker push ghcr.io/$IMAGE_OWNER/resume-matcher-frontend:${{ github.sha }}

      - name: Build & Push Evidently
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$IMAGE_OWNER/resume-matcher-evidently:${{ github.sha }} -f monitoring/evidently/Dockerfile monitoring/evidently
          docker push ghcr.io/$IMAGE_OWNER/resume-matcher-evidently:${{ github.sha }}

      - name: Canary Deploy backend
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker run -d -e CANARY=true -p 8000:8000 ghcr.io/$IMAGE_OWNER/resume-matcher-backend:${{ github.sha }}
          sleep 10

      - name: Acceptance Tests
        run: |
          urls=("http://localhost:8000/health" "http://localhost:8000/")

          for url in "${urls[@]}"; do
            status=$(curl -o /dev/null -s -w "%{http_code}" $url)
            if [ "$status" -ne 200 ]; then
              echo "❌ $url failed ($status)"
              exit 1
            fi
          done
          echo "✅ Canary deployment healthy!"
