name: CI - Lint, Test, Build & Deploy (GHCR)

on:
  push:
    branches: [ temp ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3️⃣ Cache Python dependencies
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4️⃣ Install dependencies (only installs missing ones)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      # 5️⃣ Lint
      - name: Run Ruff lint
        run: ruff check src tests || true

      - name: Run Black (non-blocking)
        run: black --check src tests || true

      # 6️⃣ Run tests with coverage
      - name: Run tests with coverage
        run: pytest --cov=src --cov-fail-under=70

      # 7️⃣ Clean up Docker space (prevent "no space left")
      - name: Docker system prune
        run: docker system prune -af

      # 8️⃣ Log in to GHCR
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 9️⃣ Build Docker images (lowercase owner & repo)
      - name: Build backend Docker image
        run: docker build -t ghcr.io/rijafaisal/resume-matcher-backend:${{ github.sha }} -f Dockerfile .

      - name: Build frontend Docker image
        run: docker build -t ghcr.io/rijafaisal/resume-matcher-frontend:${{ github.sha }} -f src/ui/Dockerfile src/ui

      - name: Build Evidently Docker image
        run: docker build -t ghcr.io/rijafaisal/resume-matcher-evidently:${{ github.sha }} -f monitoring/evidently/Dockerfile monitoring/evidently

      # 🔟 Push images to GHCR
      - name: Push Docker images to GHCR
        run: |
          docker push ghcr.io/rijafaisal/resume-matcher-backend:${{ github.sha }}
          docker push ghcr.io/rijafaisal/resume-matcher-frontend:${{ github.sha }}
          docker push ghcr.io/rijafaisal/resume-matcher-evidently:${{ github.sha }}

      # 1️⃣1️⃣ Canary deploy backend
      - name: Canary Deploy backend
        run: |
          docker run -d -e CANARY=true -p 8000:8000 ghcr.io/rijafaisal/resume-matcher-backend:${{ github.sha }}
          sleep 10

      # 1️⃣2️⃣ Acceptance Tests
      - name: Acceptance Tests
        run: |
          echo "Running acceptance tests..."
          urls=("http://localhost:8000/health" "http://localhost:8000/api/v1/ping")
          for url in "${urls[@]}"; do
            echo "Testing $url"
            status=$(curl -o /dev/null -s -w "%{http_code}" $url)
            if [ "$status" -ne 200 ]; then
              echo "❌ $url failed with status $status"
              exit 1
            fi
          done
          echo "✅ All endpoints healthy!"
