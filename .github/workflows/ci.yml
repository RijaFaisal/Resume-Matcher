name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with ruff
      run: |
        ruff check src/ tests/
        ruff format --check src/ tests/
    
    - name: Format check with black
      run: |
        black --check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-fail-under=80
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:${{ github.sha }}
          ghcr.io/${{ github.repository }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  canary-deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Deploy to canary environment
      run: |
        docker run -d \
          --name resume-matcher-canary \
          -p 8001:8000 \
          -e CANARY=true \
          ghcr.io/${{ github.repository }}:${{ github.sha }}

  acceptance-tests:
    needs: canary-deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Wait for service to be ready
      run: |
        sleep 30
        curl -f http://localhost:8001/health || exit 1
    
    - name: Run acceptance tests
      run: |
        # Test health endpoint
        curl -f http://localhost:8001/health
        
        # Test root endpoint
        curl -f http://localhost:8001/
        
        # Test API documentation
        curl -f http://localhost:8001/docs
        
        # Test model info endpoint
        curl -f http://localhost:8001/model/info
        
        # Test with sample data (if available)
        echo "All acceptance tests passed"

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Security audit with pip-audit
      run: |
        pip-audit --desc --format=json --output=audit.json
        pip-audit --desc --format=text
    
    - name: Check for critical vulnerabilities
      run: |
        pip-audit --desc --format=json | jq -r '.[] | select(.severity == "CRITICAL") | .id' | wc -l
        if [ $(pip-audit --desc --format=json | jq -r '.[] | select(.severity == "CRITICAL") | .id' | wc -l) -gt 0 ]; then
          echo "Critical vulnerabilities found!"
          exit 1
        finame: Build & Push to ECR

on:
  push:
    branches: [ temp ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build backend
        run: docker build -t resume-backend:${{ github.sha }} -f Dockerfile .

      - name: Tag & push backend
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          docker tag resume-backend:${{ github.sha }} ${ACCOUNT}.dkr.ecr.eu-north-1.amazonaws.com/resume-backend:${{ github.sha }}
          docker push ${ACCOUNT}.dkr.ecr.eu-north-1.amazonaws.com/resume-backend:${{ github.sha }}

      - name: List repo files (debug)
        run: |
          echo "PWD: $(pwd)"
          ls -la
          echo "Listing src folder:"
          ls -la src || true
          echo "Listing src/ui folder:"
          ls -la src/ui || true

      - name: Build frontend
        run: |
          echo "Building frontend from src/ui"
          if [ ! -d "./src/ui" ]; then
            echo "ERROR: ./src/ui directory not found"
            find . -maxdepth 3 -type d -print
            exit 1
          fi
          docker build -t resume-frontend:${{ github.sha }} -f src/ui/Dockerfile src/ui

      - name: Tag & push frontend
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          docker tag resume-frontend:${{ github.sha }} ${ACCOUNT}.dkr.ecr.eu-north-1.amazonaws.com/resume-frontend:${{ github.sha }}
          docker push ${ACCOUNT}.dkr.ecr.eu-north-1.amazonaws.com/resume-frontend:${{ github.sha }}

