name: Build & Push to ECR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff black

      - name: Linting (Ruff & Black)
        run: |
          ruff check src tests --fix
          black src tests

      - name: Run Tests & Coverage
        run: |
          pytest --cov=src --cov-fail-under=75

      - name: Free up disk space
        run: |
          echo "Cleaning up disk space..."
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true
          docker builder prune -af || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build backend
        run: |
          set +e
          docker build -t resume-backend:${{ github.sha }} -f Dockerfile .
          echo "Build attempt finished"

      - name: Tag & push backend
        run: |
          set +e
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          docker tag resume-backend:${{ github.sha }} ${ACCOUNT}.dkr.ecr.eu-north-1.amazonaws.com/resume-backend:${{ github.sha }}
          docker push ${ACCOUNT}.dkr.ecr.eu-north-1.amazonaws.com/resume-backend:${{ github.sha }}
          echo "Push sequence finished"

      - name: List repo files (debug)
        run: |
          echo "PWD: $(pwd)"
          ls -la
          echo "Listing src folder:"
          ls -la src || true
          echo "Listing src/ui folder:"
          ls -la src/ui || true

      - name: Build frontend
        run: |
          echo "Building frontend from src/ui"
          if [ ! -d "./src/ui" ]; then
            echo "ERROR: ./src/ui directory not found"
            find . -maxdepth 3 -type d -print
            exit 1
          fi
          docker build -t resume-frontend:${{ github.sha }} -f src/ui/Dockerfile src/ui

      - name: Tag & push frontend
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          docker tag resume-frontend:${{ github.sha }} ${ACCOUNT}.dkr.ecr.eu-north-1.amazonaws.com/resume-frontend:${{ github.sha }}
          docker push ${ACCOUNT}.dkr.ecr.eu-north-1.amazonaws.com/resume-frontend:${{ github.sha }}

  prompt-evaluation:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Prompt Evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/evaluate_prompts.py

  build-rag-and-canary:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1
        
      - name: Build RAG API
        run: |
          set +e
          docker build -t resume-rag:${{ github.sha }} -f Dockerfile.rag .
          echo "RAG build attempt finished"
        
      - name: Push RAG API
        run: |
          set +e
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          docker tag resume-rag:${{ github.sha }} ${ACCOUNT}.dkr.ecr.eu-north-1.amazonaws.com/resume-rag:${{ github.sha }}
          docker push ${ACCOUNT}.dkr.ecr.eu-north-1.amazonaws.com/resume-rag:${{ github.sha }}
          echo "RAG push sequence finished"
          
      - name: Canary Deployment (Simulation)
        run: |
          echo "Starting Canary Deployment for RAG Service..."
          # In a real scenario, this would deploy to a K8s canary service or updated ECS task set.
          # Here we verify the container runs locally as a smoke test.
          docker run -d --name rag-canary -p 8000:8000 -e GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} resume-rag:${{ github.sha }}
          
          echo "Waiting for service start..."
          sleep 10
          
          echo "Health Check..."
          curl -f http://localhost:8000/health || exit 1
          
          echo "✅ Canary Healthy"
          docker stop rag-canary
