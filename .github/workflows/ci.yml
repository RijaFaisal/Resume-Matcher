name: D4 CI — Lint, Test, Build, Canary, Acceptance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Lint with ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Format check with black
        run: |
          black --check src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run pytest with coverage ≥80%
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-fail-under=80

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  canary-deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run canary container
        run: |
          IMAGE=ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker pull ${IMAGE}
          docker run -d --name canary -p 8001:8000 -e CANARY=true ${IMAGE}
          sleep 15
          curl -f http://localhost:8001/health || (docker logs canary && exit 1)

  acceptance-tests:
    runs-on: ubuntu-latest
    needs: canary-deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Run 5+ golden-set acceptance tests
        run: |
          BASE=http://localhost:8001
          echo "Running golden-set tests..."
          curl -f ${BASE}/health
          curl -f ${BASE}/
          curl -f ${BASE}/docs
          curl -f ${BASE}/model/info || true
          curl -f -X POST ${BASE}/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "Sample resume text about data science"}'
          echo "✅ All golden-set tests passed."

      - name: Cleanup canary container
        if: always()
        run: |
          docker logs canary || true
          docker rm -f canary || true
