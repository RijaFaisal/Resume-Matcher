# .pre-commit-config.yaml
repos:
  # Basic hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace          # Remove trailing whitespace
      - id: end-of-file-fixer            # Ensure files end with a newline
      - id: check-yaml                    # Validate YAML files
      - id: check-added-large-files       # Prevent committing very large files

  # Security: detect secrets in code
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  # Python formatting and linting
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black                        # Auto-format Python code

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort                        # Sort Python imports

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8                       # Lint Python code

  # Jupyter notebook hygiene
 # - repo: https://github.com/kynan/nbstripout
 #   rev: 0.3.10
 #   hooks:
 #     - id: nbstripout                   # Strip notebook outputs
