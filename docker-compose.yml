version: '3.8'

services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile   # your sahil Dockerfile (Streamlit)
    container_name: resume_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - EVIDENTLY_WORKSPACE_PATH=./evidently_workspace
    depends_on:
      - backend
      - mlflow
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./evidently_workspace:/app/evidently_workspace

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend   # new backend Dockerfile (see below)
    container_name: resume_backend
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./models:/app/models
      - ./mlruns:/app/mlruns

  mlflow:
    image: python:3.11-slim
    container_name: resume_mlflow
    ports:
      - "5000:5000"
    command: >
      sh -c "pip install mlflow && 
             mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./mlartifacts --host 0.0.0.0 --port 5000"
    volumes:
      - ./mlruns:/mlruns
      - ./mlartifacts:/mlartifacts

  evidently:
    image: python:3.11-slim
    container_name: resume_evidently
    ports:
      - "7000:7000"
    command: >
      sh -c "pip install evidently && 
             evidently ui --host 0.0.0.0 --port 7000"
    volumes:
      - ./evidently_workspace:/evidently_workspace
